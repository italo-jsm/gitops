apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: finance-db
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/italo-jsm/gitops.git
    targetRevision: HEAD
    path: applications/finance-db

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
