apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: auth
  namespace: argocd

spec:
  project: default

  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: keycloak
    targetRevision: 25.2.0
    helm:
      releaseName: auth
      values: |
        global:
          security:
            allowInsecureImages: true

        image:
          registry: docker.io
          repository: bitnamilegacy/keycloak

        auth:
          adminUser: admin

        production: true
        proxyHeaders: xforwarded
        hostnameStrict: true
        httpEnabled: true

        ingress:
          enabled: true
          ingressClassName: traefik
          hostname: auth.italomariano.dev.br
          path: /
          pathType: Prefix
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          extraTls:
            - hosts:
                - auth.italomariano.dev.br
              secretName: wildcard-italomariano-dev-br

        postgresql:
          enabled: true
          architecture: standalone
          image:
            registry: docker.io
            repository: bitnamilegacy/postgresql

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
