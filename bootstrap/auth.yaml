apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: auth
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://repo.helmforge.dev
    chart: keycloak
    targetRevision: 3.0.2
    helm:
      releaseName: auth
      values: |
        mode: production

        image:
          repository: quay.io/keycloak/keycloak
          tag: "26.6.2"

        hostname:
          hostname: https://auth.italomariano.dev.br
          strict: true

        admin:
          username: admin

        proxy:
          headers: xforwarded

        ingress:
          public:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
            hosts:
              - host: auth.italomariano.dev.br
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: wildcard-italomariano-dev-br
                hosts:
                  - auth.italomariano.dev.br
          admin:
            enabled: false

        postgresql:
          enabled: true
          auth:
            database: keycloak
            username: keycloak

        cache:
          enabled: true
          stack: jdbc-ping

        pdb:
          enabled: true
          minAvailable: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
