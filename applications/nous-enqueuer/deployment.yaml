apiVersion: apps/v1
kind: Deployment
metadata:
  name: nous-enqueuer
  namespace: default
  labels:
    app.kubernetes.io/name: nous-enqueuer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nous-enqueuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nous-enqueuer
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: nous-enqueuer
          image: ghcr.io/italo-jsm/nous-enqueuer:sha-32e8f1663b4a647b335ef691d1a42ec9f8024aea
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: nous-enqueuer-rabbitmq
                  key: url
