apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nous-enqueuer
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nous.italomariano.dev.br
      secretName: wildcard-italomariano-dev-br
  rules:
    - host: nous.italomariano.dev.br
      http:
        paths:
          - path: /telegram/webhook
            pathType: Exact
            backend:
              service:
                name: nous-enqueuer
                port:
                  number: 80
