apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - finance.italomariano.dev.br
      secretName: wildcard-italomariano-dev-br
  rules:
    - host: finance.italomariano.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance
                port:
                  number: 80
