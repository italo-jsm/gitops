apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ai-chat-rate-limit
spec:
  rateLimit:
    average: 10
    burst: 5
    period: 1m
    sourceCriterion:
      requestHost: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-ai-chat-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ai.italomariano.dev.br
      secretName: wildcard-italomariano-dev-br
  rules:
    - host: ai.italomariano.dev.br
      http:
        paths:
          - path: /api/v1/chat
            pathType: Exact
            backend:
              service:
                name: ai
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-finance-oauth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ai.italomariano.dev.br
      secretName: wildcard-italomariano-dev-br
  rules:
    - host: ai.italomariano.dev.br
      http:
        paths:
          - path: /finance/oauth/start
            pathType: Exact
            backend:
              service:
                name: ai
                port:
                  number: 80
          - path: /login/oauth2/code/finance
            pathType: Exact
            backend:
              service:
                name: ai
                port:
                  number: 80
