apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: flagsmith-admin
spec:
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flagsmith
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-flagsmith-admin@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - flagsmith.italomariano.dev.br
      secretName: wildcard-italomariano-dev-br
  rules:
    - host: flagsmith.italomariano.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flagsmith
                port:
                  number: 80
