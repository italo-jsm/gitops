apiVersion: v1
kind: Service
metadata:
  name: flagsmith-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: flagsmith-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flagsmith-db
spec:
  serviceName: flagsmith-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagsmith-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagsmith-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.3-trixie
          securityContext:
            # Match the auth database workaround for this node runtime.
            appArmorProfile:
              type: Unconfined
          env:
            - name: POSTGRES_USER
              value: flagsmith
            - name: POSTGRES_DB
              value: flagsmith
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flagsmith-runtime
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "flagsmith", "-d", "flagsmith"]
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
