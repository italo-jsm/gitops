apiVersion: v1
kind: ConfigMap
metadata:
  name: flagsmith-config
data:
  ENVIRONMENT: production
  FLAGSMITH_DOMAIN: flagsmith.italomariano.dev.br
  DJANGO_ALLOWED_HOSTS: flagsmith.italomariano.dev.br,flagsmith,flagsmith.default.svc.cluster.local
  DJANGO_CSRF_TRUSTED_ORIGINS: https://flagsmith.italomariano.dev.br
  USE_POSTGRES_FOR_ANALYTICS: "true"
  ALLOW_REGISTRATION_WITHOUT_INVITE: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagsmith
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagsmith
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagsmith
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: docker.flagsmith.com/flagsmith/flagsmith:2.294.0
          args: ["migrate"]
          envFrom: &flagsmith-env
            - configMapRef:
                name: flagsmith-config
          env: &flagsmith-secrets
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flagsmith-runtime
                  key: database-url
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flagsmith-runtime
                  key: django-secret-key
      containers:
        - name: flagsmith
          image: docker.flagsmith.com/flagsmith/flagsmith:2.294.0
          args: ["serve"]
          envFrom: *flagsmith-env
          env: *flagsmith-secrets
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health/readiness/
              port: http
              httpHeaders:
                - name: Host
                  value: flagsmith
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness/
              port: http
              httpHeaders:
                - name: Host
                  value: flagsmith
          livenessProbe:
            httpGet:
              path: /health/liveness/
              port: http
              httpHeaders:
                - name: Host
                  value: flagsmith
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flagsmith
spec:
  selector:
    app.kubernetes.io/name: flagsmith
  ports:
    - name: http
      port: 80
      targetPort: http
