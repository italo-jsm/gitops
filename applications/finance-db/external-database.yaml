apiVersion: v1
kind: Service
metadata:
  name: finance-db
  labels:
    app.kubernetes.io/name: finance-db
    app.kubernetes.io/part-of: finance
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: finance-db
  labels:
    app.kubernetes.io/name: finance-db
    app.kubernetes.io/part-of: finance
subsets:
  - addresses:
      - ip: 192.168.0.13
    ports:
      - name: postgres
        port: 5432
